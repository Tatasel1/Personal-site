<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatasel Daniel</title>
    <link rel="stylesheet" href="CSS/style-landing.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

<body>
    <header>
        <div class="logo">
            <img src="photos/logo.png" alt="Logo">

    <main>

            <div class="left">

                        <div class="item">Developer</div>

                        <div class="item">Student</div>
                    </div>
                </div>

            </div>

            <div class="divider"></div>

            <div class="right">
                <img src="photos/myself.jpg" alt="Showcase Image">
            </div>

        </div> <div class="info-text">
            To browse my work just click on <strong>Learn more!</strong><br>
            In order to take a look at some pictures scroll down to <strong>Gallery</strong> 
        </div>

    </div>
</section>

        <section class="gallery-section">
            <h2 class="gallery_h2">Gallery</h2>
            <div id="gallery" data-mouse-down-at = "0" data-prev-percentage = "0">
                <img src="photos/car.jfif" class="image" alt="Gallery Image 1" draggable="false">
                <img src="photos/coding.png" class="image" alt="Gallery Image 2" draggable="false">
                <img src="photos/turban.jfif" class="image" alt="Gallery Image 3" draggable="false">
                <img src="photos/pacman1.png" class="image" alt="Gallery Image 4" draggable="false">

        </section>

</body>
